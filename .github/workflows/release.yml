name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release artifact
        env:
          PACKAGE_ZIP_OUT_DIR: .release-artifacts
        run: pnpm build

      - name: Verify release artifact
        run: test -f .release-artifacts/package.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" .release-artifacts/package.zip --clobber
            gh release edit "$TAG_NAME" --latest
          else
            gh release create "$TAG_NAME" .release-artifacts/package.zip \
              --title "$TAG_NAME" \
              --generate-notes \
              --verify-tag \
              --latest
          fi
